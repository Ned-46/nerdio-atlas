<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>Nerdio Atlas (unofficial)</title>
<script>
/* Use the theme the person chose inside the tool (same localStorage key), else follow the device. Runs before first paint. */
(function () {
  var pref = 'light';   // default when nothing has been chosen yet
  try {
    pref = localStorage.getItem('nmeTheme');
    if (!pref) { pref = 'light'; localStorage.setItem('nmeTheme', 'light'); }  // so the unlocked tool starts in light too
  } catch (e) { pref = pref || 'light'; }
  var light = false;
  try { light = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
  var d = document.documentElement;
  d.setAttribute('data-theme-pref', pref);
  d.setAttribute('data-theme', pref === 'auto' ? (light ? 'light' : 'dark') : pref);
})();
</script>
<style>
  :root {
    color-scheme:dark;
    --page:linear-gradient(135deg,#021c28,#042838 30%,#0a3a50); --card:linear-gradient(145deg,#0a3a50,#063245); --line:rgba(30,157,184,.25);
    --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.62); --fine:rgba(255,255,255,.55);
    --input:#021c28; --accent:#1E9DB8; --btn:#0e7c86; --err:#f87171; --logo-bg:transparent; --logo-pad:0;
  }
  :root[data-theme="light"] {
    color-scheme:light;
    --page:linear-gradient(135deg,#eef3f7,#e1ebf1); --card:linear-gradient(145deg,#ffffff,#f3f8fb); --line:rgba(4,40,56,.18);
    --text:#0a2a3a; --muted:#46606e; --fine:#46606e;
    --input:#ffffff; --accent:#0b6e78; --btn:#0b6e78; --err:#b42318; --logo-bg:#042838; --logo-pad:8px 18px;
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--page); color:var(--text); font:14px/1.6 'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .box { width:min(380px,calc(100vw - 32px)); padding:28px; border:1px solid var(--line); border-radius:12px; background:var(--card); text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.12); }
  img { height:64px; box-sizing:content-box; margin-bottom:8px; background:var(--logo-bg); padding:var(--logo-pad); border-radius:10px; }
  h1 { font-size:18px; margin:0 0 4px; font-weight:600; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  img.brandlogo { height:auto; box-sizing:border-box; margin:0 auto 14px; padding:0; background:#F5F5F5; border-radius:14px; display:block; max-width:100%; }
  p { margin:0 0 16px; color:var(--muted); font-size:12.5px; }
  input { box-sizing:border-box; width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--text); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--btn); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { min-height:20px; margin-top:10px; color:var(--err); font-size:12.5px; }
  .fine { margin-top:14px; font-size:11px; color:var(--fine); }
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <img class="brandlogo" src="brand-logo.webp" alt="Nerdio Atlas" style="width:170px">
  <h1 class="sr">Nerdio Atlas</h1>
  <p>This tool is password protected.</p>
  <input type="password" id="pw" placeholder="Password" autofocus required aria-label="Password">
  <button id="go" type="submit">Unlock</button>
  <div id="err" role="alert"></div>
  <div class="fine">Unofficial community tool.<br>Sign-ins are counted: date, time, browser and time zone. No names, passwords or IP addresses are stored.<br><span id="upd"></span></div>
</form>

  if(!window.crypto||!crypto.subtle){err.textContent='This page needs HTTPS (a secure context) to unlock.';return;}
  go.disabled=true;err.textContent='';
  try{
    const html=await unlock(document.getElementById('pw').value);
    const footer='<footer id="atlas-updated" style="text-align:center;padding:16px;font:12px/1.4 Poppins,-apple-system,Segoe UI,sans-serif;opacity:.7">Last updated: <span id="atlas-updated-date">…</span></footer>'
      +'<script>fetch("https://api.github.com/repos/Ned-46/nerdio-atlas/commits?per_page=1").then(r=>r.json()).then(c=>{document.getElementById("atlas-updated-date").textContent=new Date(c[0].commit.committer.date).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});}).catch(()=>{document.getElementById("atlas-updated").remove();});<\/script>';
    const out=/<\/body>/i.test(html)?html.replace(/<\/body>/i,()=>footer+'</body>'):html+footer;
    document.open();document.write(out);document.close();
  }catch(x){
    err.textContent='Wrong password.';go.disabled=false;
    document.getElementById('pw').select();
  }
});
</script>
